SERIAL 0 115200
DEFAULT current
# Wait 0.5s at the boot: prompt, not 2s. TIMEOUT is in tenths of a
# second. The 2s default cost ~6% of a 30.7s boot (measured on
# NUC7i3BNK, 2026-09-19) for a wait nobody uses on a normal boot.
#
# PROMPT stays 1 deliberately. PROMPT 0 would save the remaining
# 0.5s but makes the menu reachable only by holding shift or alt,
# which is a BIOS-era mechanism and unverified in the syslinux EFI
# build we boot with - if it does not work there is no local way
# into the menu at all. With PROMPT 1 any keypress still works.
TIMEOUT 5
PROMPT 1
# boot after 60 seconds even with interaction
TOTALTIMEOUT 0
# disable options menu
ALLOWOPTIONS 1

SAY
SAY dbrrg Boot Menu
SAY ----------------
SAY
SAY current  - boot current version
SAY previous - boot previous version (fallback)
SAY console  - boot to text console (no X11)
SAY verbose  - boot with verbose output
SAY debug    - boot with debug shell
SAY

LABEL current
    KERNEL /tl/vmlinuz
    APPEND ramroot=tl/ramroot.sqsh console=tty1 quiet splash plymouth.use-simpledrm
    INITRD /tl/initrd.img

LABEL previous
    KERNEL /tl.old/vmlinuz
    APPEND ramroot=tl.old/ramroot.sqsh console=tty1 quiet splash plymouth.use-simpledrm
    INITRD /tl.old/initrd.img

# rd.shell on the diagnostic entries: without it dracut answers a failed
# die() with "Refusing to continue" and leaves a blank screen, which hides
# the very error these entries exist to reveal.
# No rd.info: dracut reads it only in its non-systemd info(), and this
# initramfs runs systemd, where info() goes to the journal whatever the
# command line says. The console output comes from leaving out quiet.
LABEL console
    KERNEL /tl/vmlinuz
    APPEND ramroot=tl/ramroot.sqsh rd.shell console=ttyS0,115200 console=tty1 systemd.unit=multi-user.target plymouth.enable=0
    INITRD /tl/initrd.img

LABEL verbose
    KERNEL /tl/vmlinuz
    APPEND ramroot=tl/ramroot.sqsh rd.debug rd.shell console=ttyS0,115200 console=tty1 plymouth.enable=0
    INITRD /tl/initrd.img

LABEL debug
    KERNEL /tl/vmlinuz
    APPEND ramroot=tl/ramroot.sqsh rd.debug rd.shell rd.dbrrg.debug rd.break=pre-mount console=ttyS0,115200 console=tty1 debug
    INITRD /tl/initrd.img

LABEL network
    MENU LABEL dbrrg - Network Boot
    KERNEL /tl/vmlinuz
    APPEND root=overlay ramroot=http://192.168.1.100/boot/ramroot.sqsh rd.neednet=1 ip=dhcp console=tty1 quiet splash plymouth.use-simpledrm
    INITRD /tl/initrd.img
