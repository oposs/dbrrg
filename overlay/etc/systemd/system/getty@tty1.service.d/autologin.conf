# Autologin tluser on the first VT. This replaces nodm, which was an X11-only
# display manager. The resulting login creates a real logind session on seat0,
# which is what labwc needs for DRM/input access (so no seatd is required) and
# what provides XDG_RUNTIME_DIR for the PipeWire user services.
[Unit]
# Never let tty1 hit systemd's start limit. The session legitimately restarts
# on every logout, and a fast-failing session (labwc unable to open DRM, or a
# missing tlclient) would otherwise exhaust the default 5-starts-in-10s budget
# and leave the machine on a black screen that looks like dead hardware.
# Retrying forever with a delay is what nodm's NODM_MIN_SESSION_TIME did.
StartLimitIntervalSec=0

# Do not start the session until plymouth has released the display. plymouth
# holds DRM master while the splash is up, and a compositor cannot take DRM
# master from it - labwc simply fails to start. This is the standard ordering
# every display manager uses, and it is why starting labwc by hand a moment
# later succeeds where the automatic start failed: by then plymouth has quit.
#
# Only relevant when booting with `splash` (the `current` entry). The console
# and verbose entries pass plymouth.enable=0, where this ordering is a no-op.
After=plymouth-quit-wait.service

[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin tluser --noclear %I $TERM
RestartSec=5
