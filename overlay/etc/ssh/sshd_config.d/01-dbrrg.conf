# Root has no hash to authenticate with (containers/ubuntu/Dockerfile runs
# `passwd -d root && passwd -l root`), so this setting is inert today. It is
# set anyway because it stops being inert the moment anyone gives root a
# password, and because `PermitRootLogin yes` with an EMPTY root password was
# this image's state for a long time, held closed only by sshd's
# PermitEmptyPasswords default.
PermitRootLogin no

# Kept yes on purpose. tluser ships with `!` in its shadow field, so password
# authentication cannot succeed at all until someone runs `sudo
# dbrrg-password` at the machine; turning this off would make that password
# useless and leave no remote access, since the image carries no
# authorized_keys.
PasswordAuthentication yes
