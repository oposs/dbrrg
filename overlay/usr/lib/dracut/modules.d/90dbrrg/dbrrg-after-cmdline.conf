# Installed by 90dbrrg/module-setup.sh as a drop-in for dracut-pre-mount.service
# and dracut-mount.service.
#
# Both are ordered only after dracut-initqueue.service, which is not part of a
# dbrrg boot (root=dbrrg is no block device, so nothing queues work). They
# therefore started in parallel with dracut-cmdline.service: the mount hook
# then saw no root=dbrrg and the boot ended in "Can't mount root filesystem"
# and the emergency shell, and the pre-mount hook took a netboot for a USB boot.
[Unit]
Wants=dracut-cmdline.service
After=dracut-cmdline.service
